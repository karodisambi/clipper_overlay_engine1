<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Clipper Overlay Engine V1.3</title>
<style>
:root{
  --bg:#090b10;--panel:#141922;--panel2:#0f141c;--line:#2b3240;--text:#f8fafc;
  --muted:#94a3b8;--accent:#7c5cff;--good:#16a34a;--warn:#b45309;--danger:#991b1b;
  --highlight:#facc15;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,Arial,sans-serif}
header{position:sticky;top:0;z-index:8;padding:16px 18px;background:#090b10ee;border-bottom:1px solid var(--line);backdrop-filter:blur(10px)}
h1{font-size:18px;margin:0}.sub{font-size:12px;color:var(--muted);margin-top:4px}
main{display:grid;grid-template-columns:410px 1fr;gap:18px;max-width:1340px;margin:auto;padding:18px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px}
label{display:block;font-size:12px;color:var(--muted);margin:10px 0 6px}
input,select,textarea,button{width:100%;border-radius:10px;border:1px solid var(--line);background:var(--panel2);color:var(--text);padding:10px}
button{border:none;background:var(--accent);font-weight:800;cursor:pointer}
button:disabled{opacity:.55;cursor:not-allowed}
button.secondary{background:#222938}.good{background:var(--good)}.warn{background:#92400e}.danger{background:var(--danger)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tools{display:grid;grid-template-columns:1fr 1fr;gap:8px}
hr{border:none;border-top:1px solid var(--line);margin:16px 0}
.status{font-size:12px;color:var(--muted);margin-top:8px;white-space:pre-wrap}.ok{color:#86efac}.err{color:#fca5a5}.warning{color:#fde68a}
.badge{display:inline-block;font-size:11px;padding:4px 8px;border-radius:999px;background:#222938;color:#cbd5e1;margin-top:7px}

.stage-wrap{display:flex;justify-content:center;align-items:flex-start;padding-top:4px;min-height:70vh}
.stage{position:relative;width:min(42vw,430px);aspect-ratio:9/16;background:#000;border-radius:18px;overflow:hidden;border:1px solid var(--line);box-shadow:0 16px 60px #0009}
.bg-video,.main-video{position:absolute;inset:0;width:100%;height:100%}
.bg-video{display:none;object-fit:cover;filter:blur(22px) brightness(.52);transform:scale(1.13);pointer-events:none}
.main-video{object-fit:contain;background:#000;z-index:2}
.stage.mode-fill .main-video{object-fit:cover}
.stage.mode-blur .bg-video{display:block}
.stage.mode-blur .main-video{object-fit:contain;background:transparent}
.stage.mode-original .main-video{object-fit:contain;background:#000}
.main-video.pos-top{object-position:center top}
.main-video.pos-center{object-position:center center}
.main-video.pos-bottom{object-position:center bottom}

.overlay{position:absolute;left:6%;right:6%;top:78%;transform:translateY(-50%);text-align:center;font-weight:950;font-size:clamp(23px,3vw,42px);line-height:1.08;text-shadow:0 3px 18px #000,0 2px 3px #000;pointer-events:none;z-index:5}
.overlay.top{top:17%}.overlay.center{top:50%}.overlay.bottom{top:78%}
.overlay.punch{font-size:clamp(31px,4vw,58px);letter-spacing:-.02em}
.overlay.pop{animation:pop .16s ease-out}@keyframes pop{from{transform:translateY(-50%) scale(.7);opacity:0}to{transform:translateY(-50%) scale(1);opacity:1}}
.highlight{display:inline-block;transform:scale(1.04)}

.progress{position:absolute;z-index:6;left:5%;right:5%;bottom:3.6%;height:5px;background:#ffffff30;border-radius:999px;overflow:hidden}
.progress>div{height:100%;width:0%;background:white;border-radius:999px}

.items{display:flex;flex-direction:column;gap:7px;max-height:310px;overflow:auto}
.item{background:#10151d;border:1px solid var(--line);border-radius:10px;padding:8px;font-size:12px}.item b{display:block;margin-bottom:4px}.tiny{font-size:11px;color:var(--muted)}

@media(max-width:840px){
  main{grid-template-columns:1fr;padding:12px}
  .stage{width:min(92vw,430px)}
  .stage-wrap{min-height:auto}
}
</style>
</head>
<body>
<header>
  <h1>CLIPPER AI STUDIO — Overlay Engine V1.3</h1>
  <div class="sub">Smart Phrase Caption · Auto Reframe 9:16 · Viral Overlay · Cloudflare Whisper</div>
</header>

<main>
<section class="panel">
  <label>1. Upload video / audio</label>
  <input id="file" type="file" accept="video/*,audio/*">
  <div id="fileInfo" class="status">Belum ada file.</div>

  <hr>

  <label>2. AI Transcription Presisi</label>
  <button id="transcribe" class="good">✨ Auto Transcribe Presisi</button>
  <div id="aiStatus" class="status">Provider: Cloudflare Workers AI</div>

  <label>Hasil transkrip</label>
  <textarea id="transcript" rows="5" placeholder="Transkrip akan muncul di sini..."></textarea>

  <label>WebVTT / timing asli</label>
  <textarea id="vtt" rows="4" placeholder="Timing VTT dari Whisper..." readonly></textarea>

  <hr>

  <label>3. Smart Phrase Caption</label>
  <div class="row">
    <div>
      <label>Target kata / phrase</label>
      <select id="wordsPerPhrase">
        <option value="3">3 kata</option>
        <option value="4" selected>4 kata</option>
        <option value="5">5 kata</option>
      </select>
    </div>
    <div>
      <label>Max durasi phrase</label>
      <select id="maxPhraseDur">
        <option value="1.8">1.8 detik</option>
        <option value="2.2" selected>2.2 detik</option>
        <option value="2.8">2.8 detik</option>
      </select>
    </div>
  </div>

  <div class="row">
    <div>
      <label>Posisi subtitle</label>
      <select id="captionPosition">
        <option value="bottom" selected>Bawah</option>
        <option value="center">Tengah</option>
        <option value="top">Atas</option>
      </select>
    </div>
    <div>
      <label>Warna highlight</label>
      <input id="highlightColor" type="color" value="#facc15">
    </div>
  </div>

  <div class="tools">
    <button id="smartCaption" class="warn">⚡ Smart Caption</button>
    <button id="viralOverlay">🔥 Viral Overlay</button>
  </div>
  <div class="badge">Gabungkan cue 1 kata menjadi phrase 3–5 kata dengan timing asli.</div>

  <hr>

  <label>4. Auto Reframe 9:16</label>
  <div class="row">
    <div>
      <label>Mode</label>
      <select id="reframeMode">
        <option value="fill" selected>Fill / Crop 9:16</option>
        <option value="blur">Blur Background</option>
        <option value="original">Original / Contain</option>
      </select>
    </div>
    <div>
      <label>Fokus vertikal</label>
      <select id="focusPosition">
        <option value="top">Atas</option>
        <option value="center" selected>Tengah</option>
        <option value="bottom">Bawah</option>
      </select>
    </div>
  </div>

  <label>Style preset</label>
  <select id="stylePreset">
    <option value="viral" selected>🔥 Viral Podcast</option>
    <option value="clean">✨ Clean Premium</option>
    <option value="ugc">📱 UGC TikTok</option>
  </select>

  <label style="display:flex;align-items:center;gap:8px">
    <input id="showProgress" type="checkbox" checked style="width:auto"> Tampilkan progress bar
  </label>

  <hr>

  <label>5. Manual overlay</label>
  <textarea id="manualText" rows="2" placeholder="Teks overlay manual..."></textarea>
  <div class="row">
    <div><label>Mulai</label><input id="start" type="number" step="0.1" value="0"></div>
    <div><label>Selesai</label><input id="end" type="number" step="0.1" value="2.5"></div>
  </div>
  <div class="row">
    <div>
      <label>Posisi</label>
      <select id="position"><option value="top">Atas</option><option value="center">Tengah</option><option value="bottom" selected>Bawah</option></select>
    </div>
    <div>
      <label>Animasi</label>
      <select id="animation"><option value="pop" selected>Pop</option><option value="">None</option></select>
    </div>
  </div>
  <button id="useCurrent" class="secondary">Gunakan waktu video saat ini</button>
  <div style="height:8px"></div>
  <button id="addManual">+ Tambah Overlay</button>

  <hr>

  <label>Overlay Plan</label>
  <div id="items" class="items"></div>
  <div id="status" class="status">0 overlay.</div>

  <div style="height:10px"></div>
  <div class="tools">
    <button id="export" class="secondary">Export JSON</button>
    <button id="clear" class="danger">Hapus Semua</button>
  </div>
</section>

<section class="panel stage-wrap">
  <div id="stage" class="stage mode-fill">
    <video id="bgVideo" class="bg-video" muted playsinline></video>
    <video id="video" class="main-video pos-center" controls playsinline></video>
    <div id="overlay" class="overlay bottom" style="display:none"></div>
    <div id="progress" class="progress"><div id="progressFill"></div></div>
  </div>
</section>
</main>

<script>
const ENDPOINT='https://clipper-overlay-api.disambikaro.workers.dev/transcribe';
const $=id=>document.getElementById(id);
const video=$('video'), bgVideo=$('bgVideo'), overlay=$('overlay'), items=$('items');
let selectedFile=null;
let transcriptData={text:'',segments:[],vtt:''};
let overlays=[];

$('file').addEventListener('change',e=>{
  selectedFile=e.target.files?.[0]||null;
  if(!selectedFile)return;
  const url=URL.createObjectURL(selectedFile);
  video.src=url;
  bgVideo.src=url;
  const mb=(selectedFile.size/1024/1024).toFixed(2);
  $('fileInfo').textContent=`${selectedFile.name} · ${mb} MB`;
  $('fileInfo').className=selectedFile.size>10*1024*1024?'status warning':'status ok';
  if(selectedFile.size>10*1024*1024)$('fileInfo').textContent+='\nUntuk testing V1.3 gunakan file <10 MB.';
});

$('transcribe').onclick=async()=>{
  if(!selectedFile)return alert('Pilih file dulu.');
  if(selectedFile.size>10*1024*1024)return alert('Gunakan file di bawah 10 MB dulu.');
  $('transcribe').disabled=true;
  $('aiStatus').textContent='Mentranskripsi + mengambil timing VTT...';
  $('aiStatus').className='status warning';
  try{
    const fd=new FormData();
    fd.append('file',selectedFile,selectedFile.name);
    const r=await fetch(ENDPOINT,{method:'POST',body:fd});
    const d=await r.json();
    if(!r.ok||!d.ok)throw new Error(d?.error||JSON.stringify(d));
    transcriptData={text:d.text||'',segments:Array.isArray(d.segments)?d.segments:[],vtt:d.vtt||''};
    $('transcript').value=transcriptData.text;
    $('vtt').value=transcriptData.vtt;
    const cues=parseVTT(transcriptData.vtt);
    $('aiStatus').textContent=`Berhasil · ${cues.length} cue VTT · ${transcriptData.segments.length} segment`;
    $('aiStatus').className='status ok';
  }catch(err){
    $('aiStatus').textContent='Gagal: '+err.message;
    $('aiStatus').className='status err';
  }finally{$('transcribe').disabled=false;}
};

function timeToSec(s){
  const p=s.trim().split(':').map(Number);
  if(p.length===3)return p[0]*3600+p[1]*60+p[2];
  if(p.length===2)return p[0]*60+p[1];
  return Number(s)||0;
}

function parseVTT(vtt){
  if(!vtt)return [];
  const lines=vtt.replace(/\r/g,'').split('\n');
  const cues=[];
  for(let i=0;i<lines.length;i++){
    const line=lines[i].trim();
    if(!line.includes('-->'))continue;
    const parts=line.split('-->');
    const start=timeToSec(parts[0]);
    const end=timeToSec(parts[1].trim().split(/\s+/)[0]);
    const text=[];
    i++;
    while(i<lines.length && lines[i].trim()!==''){
      text.push(lines[i].trim().replace(/<[^>]+>/g,''));
      i++;
    }
    const t=text.join(' ').trim();
    if(t)cues.push({start,end,text:t});
  }
  return cues;
}

function normalizeSegments(segments){
  return segments.map(s=>({
    start:Number(s.start ?? s.start_time ?? s.from ?? 0),
    end:Number(s.end ?? s.end_time ?? s.to ?? 0),
    text:String(s.text ?? s.transcript ?? '').trim()
  })).filter(s=>s.text && s.end>s.start);
}

function sourceCues(){
  let cues=parseVTT(transcriptData.vtt);
  if(cues.length)return cues;
  cues=normalizeSegments(transcriptData.segments);
  if(cues.length)return cues;
  const text=$('transcript').value.trim();
  if(!text||!video.duration)return [];
  const words=text.split(/\s+/);
  const groups=[];
  for(let i=0;i<words.length;i+=4)groups.push(words.slice(i,i+4).join(' '));
  const dur=video.duration/groups.length;
  return groups.map((t,i)=>({start:i*dur,end:(i+1)*dur,text:t}));
}

function smartGroup(cues,targetWords,maxDur){
  const out=[];
  let current=null;
  for(const cue of cues){
    const words=cue.text.split(/\s+/).filter(Boolean);
    for(const word of words){
      if(!current){
        current={start:cue.start,end:cue.end,words:[word]};
      }else{
        const pause=Math.max(0,cue.start-current.end);
        const newDur=Math.max(cue.end,current.end)-current.start;
        const punct=/[.!?,:;]$/.test(current.words[current.words.length-1]||'');
        if(current.words.length>=targetWords || newDur>maxDur || pause>0.55 || punct){
          out.push({start:current.start,end:current.end,text:current.words.join(' ')});
          current={start:cue.start,end:cue.end,words:[word]};
        }else{
          current.words.push(word);
          current.end=Math.max(current.end,cue.end);
        }
      }
      if(/[.!?]$/.test(word) && current){
        out.push({start:current.start,end:current.end,text:current.words.join(' ')});
        current=null;
      }
    }
  }
  if(current)out.push({start:current.start,end:current.end,text:current.words.join(' ')});
  return out.filter(x=>x.text.trim());
}

const stopwords=new Set('yang dan di ke dari untuk dengan ini itu ada jadi juga karena pada dalam atau kalau tapi sudah belum akan bisa sama saya aku kamu kita mereka dia sebuah lebih tidak nggak gak nya si sebagai saat agar oleh ketika'.split(' '));

function cleanWord(w){return w.toLowerCase().replace(/[^\p{L}\p{N}%]/gu,'')}

function pickKeyword(text){
  const words=text.split(/\s+/);
  const scored=words.map((w,i)=>{
    const c=cleanWord(w);
    let score=0;
    if(/\d/.test(c))score+=7;
    if(c.length>=8)score+=5;
    else if(c.length>=6)score+=3;
    if(!stopwords.has(c))score+=2;
    if(/[!?]/.test(w))score+=2;
    return {raw:w,clean:c,score,i};
  }).filter(x=>x.clean && !stopwords.has(x.clean));
  scored.sort((a,b)=>b.score-a.score || a.i-b.i);
  return scored[0]?.raw||'';
}

function escapeHTML(s){
  return s.replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
}
function regexEscape(s){return s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')}
function highlightHTML(text,keyword,color){
  const safe=escapeHTML(text);
  if(!keyword)return safe;
  return safe.replace(new RegExp(`(${regexEscape(keyword)})`,'i'),`<span class="highlight" style="color:${color}">$1</span>`);
}

function buildSmart(viral=false){
  const raw=sourceCues();
  if(!raw.length)return alert('Jalankan Auto Transcribe dulu.');
  const target=Number($('wordsPerPhrase').value);
  const maxDur=Number($('maxPhraseDur').value);
  const grouped=smartGroup(raw,target,maxDur);
  const pos=$('captionPosition').value;
  const color=$('highlightColor').value;
  overlays=overlays.filter(o=>!['smart-caption','viral-punch'].includes(o.source));

  grouped.forEach((c,i)=>{
    const kw=pickKeyword(c.text);
    overlays.push({
      id:crypto.randomUUID?crypto.randomUUID():String(Date.now()+i),
      source:'smart-caption',type:'caption',text:c.text,
      highlightWord:kw,highlightColor:color,
      start:+c.start.toFixed(2),end:+c.end.toFixed(2),
      position:pos,animation:'pop',priority:2
    });

    if(viral && kw && (i===0 || i%3===0)){
      overlays.push({
        id:crypto.randomUUID?crypto.randomUUID():String(Date.now()+1000+i),
        source:'viral-punch',type:'punch',
        text:kw.replace(/[.,!?]/g,'').toUpperCase(),
        start:+c.start.toFixed(2),
        end:+Math.min(c.end,c.start+0.8).toFixed(2),
        position:'center',animation:'pop',color:color,priority:10
      });
    }
  });
  renderList();
  $('status').textContent=`${grouped.length} smart phrase dibuat${viral?' + punch overlay':''}.`;
  $('status').className='status ok';
}

$('smartCaption').onclick=()=>buildSmart(false);
$('viralOverlay').onclick=()=>buildSmart(true);

function applyReframe(){
  const mode=$('reframeMode').value;
  const focus=$('focusPosition').value;
  $('stage').className=`stage mode-${mode}`;
  video.className=`main-video pos-${focus}`;
}
$('reframeMode').onchange=applyReframe;
$('focusPosition').onchange=applyReframe;
applyReframe();

function applyPreset(){
  const p=$('stylePreset').value;
  if(p==='viral'){
    $('highlightColor').value='#facc15';
    $('captionPosition').value='bottom';
    $('wordsPerPhrase').value='4';
    $('maxPhraseDur').value='2.2';
    $('reframeMode').value='fill';
  }else if(p==='clean'){
    $('highlightColor').value='#ffffff';
    $('captionPosition').value='bottom';
    $('wordsPerPhrase').value='5';
    $('maxPhraseDur').value='2.8';
    $('reframeMode').value='blur';
  }else{
    $('highlightColor').value='#facc15';
    $('captionPosition').value='center';
    $('wordsPerPhrase').value='3';
    $('maxPhraseDur').value='1.8';
    $('reframeMode').value='fill';
  }
  applyReframe();
}
$('stylePreset').onchange=applyPreset;

$('showProgress').onchange=()=>{$('progress').style.display=$('showProgress').checked?'block':'none'};

video.addEventListener('play',()=>{bgVideo.currentTime=video.currentTime;bgVideo.play().catch(()=>{})});
video.addEventListener('pause',()=>bgVideo.pause());
video.addEventListener('seeking',()=>{bgVideo.currentTime=video.currentTime});
video.addEventListener('ratechange',()=>{bgVideo.playbackRate=video.playbackRate});

$('useCurrent').onclick=()=>{
  $('start').value=(video.currentTime||0).toFixed(1);
  $('end').value=((video.currentTime||0)+2.5).toFixed(1);
};

$('addManual').onclick=()=>{
  const text=$('manualText').value.trim();
  const start=parseFloat($('start').value||0),end=parseFloat($('end').value||0);
  if(!text)return alert('Isi teks manual.');
  if(end<=start)return alert('Waktu selesai harus lebih besar.');
  overlays.push({
    id:crypto.randomUUID?crypto.randomUUID():String(Date.now()),
    source:'manual',type:'text',text,start,end,
    position:$('position').value,animation:$('animation').value,color:'#ffffff',priority:5
  });
  renderList();
};

$('clear').onclick=()=>{overlays=[];renderList()};

function renderList(){
  items.innerHTML='';
  overlays.sort((a,b)=>a.start-b.start || (b.priority||0)-(a.priority||0)).forEach((o,idx)=>{
    const d=document.createElement('div');
    d.className='item';
    d.innerHTML=`<b>${idx+1}. ${escapeHTML(o.text)}</b>
      <div class="tiny">${o.start}s → ${o.end}s · ${o.type} · ${o.source}</div>
      <button class="secondary" style="margin-top:6px;padding:6px" data-id="${o.id}">Hapus</button>`;
    items.appendChild(d);
  });
  items.querySelectorAll('button').forEach(b=>b.onclick=()=>{overlays=overlays.filter(x=>x.id!==b.dataset.id);renderList()});
  $('status').textContent=`${overlays.length} overlay tersimpan.`;
}

video.addEventListener('timeupdate',()=>{
  if(Math.abs(bgVideo.currentTime-video.currentTime)>.18)bgVideo.currentTime=video.currentTime;
  if(video.duration){
    $('progressFill').style.width=`${Math.min(100,(video.currentTime/video.duration)*100)}%`;
  }
  const t=video.currentTime;
  const active=overlays.filter(o=>t>=o.start&&t<=o.end).sort((a,b)=>(b.priority||0)-(a.priority||0))[0];
  if(!active){overlay.style.display='none';return}
  overlay.className=`overlay ${active.position||'bottom'} ${active.animation||''} ${active.type==='punch'?'punch':''}`;
  overlay.style.color=active.color||'#fff';
  overlay.innerHTML=active.type==='caption'
    ? highlightHTML(active.text,active.highlightWord,active.highlightColor||'#facc15')
    : escapeHTML(active.text);
  overlay.style.display='block';
});

$('export').onclick=()=>{
  const payload={
    version:'1.3',
    engine:'Clipper AI Studio',
    provider:'Cloudflare Workers AI',
    model:'@cf/openai/whisper-large-v3-turbo',
    aspectRatio:'9:16',
    reframe:{mode:$('reframeMode').value,focus:$('focusPosition').value},
    stylePreset:$('stylePreset').value,
    progressBar:$('showProgress').checked,
    createdAt:new Date().toISOString(),
    transcript:$('transcript').value.trim(),
    vtt:$('vtt').value,
    segments:transcriptData.segments,
    overlays
  };
  const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='overlay_plan_v1_3.json';
  a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),500);
};

renderList();
applyPreset();
</script>
</body>
</html>
