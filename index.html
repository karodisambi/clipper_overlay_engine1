<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Clipper Overlay Engine V1.2</title>
<style>
:root{
  --bg:#090b10;--panel:#141922;--panel2:#0f141c;--line:#2b3240;--text:#f8fafc;
  --muted:#94a3b8;--accent:#7c5cff;--good:#16a34a;--warn:#d97706;--danger:#991b1b;
  --highlight:#facc15;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,Arial,sans-serif}
header{position:sticky;top:0;z-index:8;padding:16px 18px;background:#090b10ee;border-bottom:1px solid var(--line);backdrop-filter:blur(10px)}
h1{font-size:18px;margin:0}.sub{font-size:12px;color:var(--muted);margin-top:4px}
main{display:grid;grid-template-columns:390px 1fr;gap:18px;max-width:1300px;margin:auto;padding:18px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px}
label{display:block;font-size:12px;color:var(--muted);margin:10px 0 6px}
input,select,textarea,button{width:100%;border-radius:10px;border:1px solid var(--line);background:var(--panel2);color:var(--text);padding:10px}
button{border:none;background:var(--accent);font-weight:800;cursor:pointer}
button:disabled{opacity:.55;cursor:not-allowed}
button.secondary{background:#222938}.good{background:var(--good)}.warn{background:#92400e}.danger{background:var(--danger)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
hr{border:none;border-top:1px solid var(--line);margin:16px 0}
.status{font-size:12px;color:var(--muted);margin-top:8px;white-space:pre-wrap}.ok{color:#86efac}.err{color:#fca5a5}.warning{color:#fde68a}
.stage-wrap{display:flex;justify-content:center;align-items:flex-start;padding-top:4px;min-height:70vh}
.stage{position:relative;width:min(42vw,430px);aspect-ratio:9/16;background:#000;border-radius:18px;overflow:hidden;border:1px solid var(--line);box-shadow:0 16px 60px #0009}
video{width:100%;height:100%;object-fit:contain;background:#000}
.overlay{position:absolute;left:6%;right:6%;top:78%;transform:translateY(-50%);text-align:center;font-weight:950;font-size:clamp(23px,3vw,42px);line-height:1.08;text-shadow:0 3px 18px #000,0 2px 3px #000;pointer-events:none}
.overlay.top{top:17%}.overlay.center{top:50%}.overlay.bottom{top:78%}
.overlay.punch{font-size:clamp(30px,4vw,58px);letter-spacing:-.02em}
.overlay.pop{animation:pop .18s ease-out}@keyframes pop{from{transform:translateY(-50%) scale(.68);opacity:0}to{transform:translateY(-50%) scale(1);opacity:1}}
.highlight{color:var(--highlight);display:inline-block;transform:scale(1.04)}
.items{display:flex;flex-direction:column;gap:7px;max-height:310px;overflow:auto}
.item{background:#10151d;border:1px solid var(--line);border-radius:10px;padding:8px;font-size:12px}.item b{display:block;margin-bottom:4px}.tiny{font-size:11px;color:var(--muted)}
.badge{display:inline-block;font-size:11px;padding:4px 8px;border-radius:999px;background:#222938;color:#cbd5e1;margin-top:7px}
.tools{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media(max-width:820px){main{grid-template-columns:1fr;padding:12px}.stage{width:min(92vw,430px)}.stage-wrap{min-height:auto}}
</style>
</head>
<body>
<header>
  <h1>CLIPPER AI STUDIO — Overlay Engine V1.2</h1>
  <div class="sub">Precise VTT timing · Keyword Highlight · Punch Text · Cloudflare Whisper</div>
</header>

<main>
<section class="panel">
  <label>1. Upload video / audio</label>
  <input id="file" type="file" accept="video/*,audio/*">
  <div id="fileInfo" class="status">Belum ada file.</div>

  <hr>

  <label>2. AI Transcription</label>
  <button id="transcribe" class="good">✨ Auto Transcribe Presisi</button>
  <div id="aiStatus" class="status">Provider: Cloudflare Workers AI</div>

  <label>Hasil transkrip</label>
  <textarea id="transcript" rows="5" placeholder="Transkrip akan muncul di sini..."></textarea>

  <label>WebVTT / timing</label>
  <textarea id="vtt" rows="5" placeholder="Timing VTT dari Whisper..." readonly></textarea>

  <div class="row">
    <div>
      <label>Posisi subtitle</label>
      <select id="captionPosition">
        <option value="bottom" selected>Bawah</option>
        <option value="center">Tengah</option>
        <option value="top">Atas</option>
      </select>
    </div>
    <div>
      <label>Warna highlight</label>
      <input id="highlightColor" type="color" value="#facc15">
    </div>
  </div>

  <div class="tools">
    <button id="preciseCaption" class="warn">⚡ Caption Presisi</button>
    <button id="viralOverlay">🔥 Viral Overlay</button>
  </div>

  <div class="badge">Caption menggunakan timing WebVTT asli bila tersedia.</div>

  <hr>

  <label>3. Manual overlay</label>
  <textarea id="manualText" rows="2" placeholder="Teks overlay manual..."></textarea>
  <div class="row">
    <div><label>Mulai</label><input id="start" type="number" step="0.1" value="0"></div>
    <div><label>Selesai</label><input id="end" type="number" step="0.1" value="2.5"></div>
  </div>
  <div class="row">
    <div>
      <label>Posisi</label>
      <select id="position"><option value="top">Atas</option><option value="center">Tengah</option><option value="bottom" selected>Bawah</option></select>
    </div>
    <div>
      <label>Animasi</label>
      <select id="animation"><option value="pop" selected>Pop</option><option value="">None</option></select>
    </div>
  </div>
  <button id="useCurrent" class="secondary">Gunakan waktu video saat ini</button>
  <div style="height:8px"></div>
  <button id="addManual">+ Tambah Overlay</button>

  <hr>

  <label>Overlay Plan</label>
  <div id="items" class="items"></div>
  <div id="status" class="status">0 overlay.</div>

  <div style="height:10px"></div>
  <div class="tools">
    <button id="export" class="secondary">Export JSON</button>
    <button id="clear" class="danger">Hapus Semua</button>
  </div>
</section>

<section class="panel stage-wrap">
  <div class="stage">
    <video id="video" controls playsinline></video>
    <div id="overlay" class="overlay bottom" style="display:none"></div>
  </div>
</section>
</main>

<script>
const ENDPOINT='https://clipper-overlay-api.disambikaro.workers.dev/transcribe';
const $=id=>document.getElementById(id);
const video=$('video'), overlay=$('overlay'), items=$('items');

let selectedFile=null;
let transcriptData={text:'',segments:[],vtt:''};
let overlays=[];

$('file').addEventListener('change',e=>{
  selectedFile=e.target.files?.[0]||null;
  if(!selectedFile)return;
  video.src=URL.createObjectURL(selectedFile);
  const mb=(selectedFile.size/1024/1024).toFixed(2);
  $('fileInfo').textContent=`${selectedFile.name} · ${mb} MB`;
  $('fileInfo').className=selectedFile.size>10*1024*1024?'status warning':'status ok';
  if(selectedFile.size>10*1024*1024)$('fileInfo').textContent+='\nGunakan file <10 MB untuk V1.2.';
});

$('transcribe').onclick=async()=>{
  if(!selectedFile)return alert('Pilih file dulu.');
  if(selectedFile.size>10*1024*1024)return alert('Gunakan file di bawah 10 MB dulu.');
  $('transcribe').disabled=true;
  $('aiStatus').textContent='Mentranskripsi dan mengambil timing...';
  $('aiStatus').className='status warning';
  try{
    const fd=new FormData();
    fd.append('file',selectedFile,selectedFile.name);
    const r=await fetch(ENDPOINT,{method:'POST',body:fd});
    const d=await r.json();
    if(!r.ok||!d.ok)throw new Error(d?.error||JSON.stringify(d));
    transcriptData={text:d.text||'',segments:Array.isArray(d.segments)?d.segments:[],vtt:d.vtt||''};
    $('transcript').value=transcriptData.text;
    $('vtt').value=transcriptData.vtt;
    const cues=parseVTT(transcriptData.vtt);
    $('aiStatus').textContent=`Berhasil · ${cues.length} cue VTT · ${transcriptData.segments.length} segment`;
    $('aiStatus').className='status ok';
  }catch(err){
    $('aiStatus').textContent='Gagal: '+err.message;
    $('aiStatus').className='status err';
  }finally{$('transcribe').disabled=false;}
};

function timeToSec(s){
  const p=s.trim().split(':').map(Number);
  if(p.length===3)return p[0]*3600+p[1]*60+p[2];
  if(p.length===2)return p[0]*60+p[1];
  return Number(s)||0;
}

function parseVTT(vtt){
  if(!vtt)return [];
  const lines=vtt.replace(/\r/g,'').split('\n');
  const cues=[];
  for(let i=0;i<lines.length;i++){
    const line=lines[i].trim();
    if(!line.includes('-->'))continue;
    const parts=line.split('-->');
    const start=timeToSec(parts[0]);
    const end=timeToSec(parts[1].trim().split(/\s+/)[0]);
    const text=[];
    i++;
    while(i<lines.length && lines[i].trim()!==''){
      text.push(lines[i].trim().replace(/<[^>]+>/g,''));
      i++;
    }
    const t=text.join(' ').trim();
    if(t)cues.push({start,end,text:t});
  }
  return cues;
}

function normalizeSegments(segments){
  return segments.map(s=>({
    start:Number(s.start ?? s.start_time ?? s.from ?? 0),
    end:Number(s.end ?? s.end_time ?? s.to ?? 0),
    text:String(s.text ?? s.transcript ?? '').trim()
  })).filter(s=>s.text && s.end>s.start);
}

function captionCues(){
  let cues=parseVTT(transcriptData.vtt);
  if(cues.length)return cues;
  cues=normalizeSegments(transcriptData.segments);
  if(cues.length)return cues;
  const text=$('transcript').value.trim();
  if(!text||!video.duration)return [];
  const words=text.split(/\s+/);
  const groups=[];
  for(let i=0;i<words.length;i+=4)groups.push(words.slice(i,i+4).join(' '));
  const dur=video.duration/groups.length;
  return groups.map((t,i)=>({start:i*dur,end:(i+1)*dur,text:t}));
}

const stopwords=new Set('yang dan di ke dari untuk dengan ini itu ada jadi juga karena pada dalam atau kalau tapi sudah belum akan bisa sama saya aku kamu kita mereka dia sebuah lebih tidak nggak gak nya si sebagai saat agar oleh'.split(' '));

function cleanWord(w){return w.toLowerCase().replace(/[^\p{L}\p{N}%]/gu,'')}

function pickKeyword(text){
  const words=text.split(/\s+/);
  const scored=words.map((w,i)=>{
    const c=cleanWord(w);
    let score=0;
    if(/\d/.test(c))score+=6;
    if(c.length>=8)score+=5;
    else if(c.length>=6)score+=3;
    if(!stopwords.has(c))score+=2;
    if(/[!?]/.test(w))score+=2;
    return {raw:w,clean:c,score,i};
  }).filter(x=>x.clean && !stopwords.has(x.clean));
  scored.sort((a,b)=>b.score-a.score || a.i-b.i);
  return scored[0]?.raw||'';
}

function escapeHTML(s){
  return s.replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
}

function highlightHTML(text,keyword,color){
  const safe=escapeHTML(text);
  if(!keyword)return safe;
  const k=keyword.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
  return safe.replace(new RegExp(`(${k})`,'i'),`<span class="highlight" style="color:${color}">$1</span>`);
}

$('preciseCaption').onclick=()=>{
  const cues=captionCues();
  if(!cues.length)return alert('Belum ada timing. Jalankan Auto Transcribe dulu.');
  overlays=overlays.filter(o=>o.source!=='precise-caption' && o.source!=='viral-punch');
  const pos=$('captionPosition').value;
  const color=$('highlightColor').value;
  cues.forEach((c,i)=>{
    const kw=pickKeyword(c.text);
    overlays.push({
      id:crypto.randomUUID?crypto.randomUUID():String(Date.now()+i),
      source:'precise-caption',
      type:'caption',
      text:c.text,
      highlightWord:kw,
      highlightColor:color,
      start:+c.start.toFixed(2),
      end:+c.end.toFixed(2),
      position:pos,
      animation:'pop'
    });
  });
  renderList();
};

$('viralOverlay').onclick=()=>{
  const cues=captionCues();
  if(!cues.length)return alert('Jalankan Auto Transcribe dulu.');
  overlays=overlays.filter(o=>o.source!=='precise-caption' && o.source!=='viral-punch');
  const pos=$('captionPosition').value;
  const color=$('highlightColor').value;
  cues.forEach((c,i)=>{
    const kw=pickKeyword(c.text);
    overlays.push({
      id:crypto.randomUUID?crypto.randomUUID():String(Date.now()+i),
      source:'precise-caption',
      type:'caption',
      text:c.text,
      highlightWord:kw,
      highlightColor:color,
      start:+c.start.toFixed(2),
      end:+c.end.toFixed(2),
      position:pos,
      animation:'pop'
    });
    if(kw && (i===0 || i%3===0)){
      const punchStart=c.start;
      const punchEnd=Math.min(c.end,c.start+0.85);
      overlays.push({
        id:crypto.randomUUID?crypto.randomUUID():String(Date.now()+1000+i),
        source:'viral-punch',
        type:'punch',
        text:kw.replace(/[.,!?]/g,'').toUpperCase(),
        start:+punchStart.toFixed(2),
        end:+punchEnd.toFixed(2),
        position:'center',
        animation:'pop',
        color:color,
        priority:10
      });
    }
  });
  renderList();
};

$('useCurrent').onclick=()=>{
  $('start').value=(video.currentTime||0).toFixed(1);
  $('end').value=((video.currentTime||0)+2.5).toFixed(1);
};

$('addManual').onclick=()=>{
  const text=$('manualText').value.trim();
  const start=parseFloat($('start').value||0),end=parseFloat($('end').value||0);
  if(!text)return alert('Isi teks manual.');
  if(end<=start)return alert('Waktu selesai harus lebih besar.');
  overlays.push({
    id:crypto.randomUUID?crypto.randomUUID():String(Date.now()),
    source:'manual',type:'text',text,start,end,
    position:$('position').value,animation:$('animation').value,color:'#ffffff'
  });
  renderList();
};

$('clear').onclick=()=>{overlays=[];renderList();};

function renderList(){
  items.innerHTML='';
  overlays.sort((a,b)=>a.start-b.start || (b.priority||0)-(a.priority||0)).forEach((o,idx)=>{
    const d=document.createElement('div');
    d.className='item';
    d.innerHTML=`<b>${idx+1}. ${escapeHTML(o.text)}</b><div class="tiny">${o.start}s → ${o.end}s · ${o.type} · ${o.source}</div><button class="secondary" style="margin-top:6px;padding:6px" data-id="${o.id}">Hapus</button>`;
    items.appendChild(d);
  });
  items.querySelectorAll('button').forEach(b=>b.onclick=()=>{overlays=overlays.filter(x=>x.id!==b.dataset.id);renderList();});
  $('status').textContent=`${overlays.length} overlay tersimpan.`;
}

video.addEventListener('timeupdate',()=>{
  const t=video.currentTime;
  const active=overlays.filter(o=>t>=o.start&&t<=o.end).sort((a,b)=>(b.priority||0)-(a.priority||0))[0];
  if(!active){overlay.style.display='none';return;}
  overlay.className=`overlay ${active.position||'bottom'} ${active.animation||''} ${active.type==='punch'?'punch':''}`;
  overlay.style.color=active.color||'#fff';
  overlay.innerHTML=active.type==='caption'
    ? highlightHTML(active.text,active.highlightWord,active.highlightColor||'#facc15')
    : escapeHTML(active.text);
  overlay.style.display='block';
});

$('export').onclick=()=>{
  const payload={
    version:'1.2',
    engine:'Clipper AI Studio',
    transcriptionProvider:'Cloudflare Workers AI',
    model:'@cf/openai/whisper-large-v3-turbo',
    aspectRatio:'9:16',
    createdAt:new Date().toISOString(),
    transcript:$('transcript').value.trim(),
    vtt:$('vtt').value,
    segments:transcriptData.segments,
    overlays
  };
  const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='overlay_plan_v1_2.json';
  a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),500);
};

renderList();
</script>
</body>
</html>
