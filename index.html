<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Clipper Overlay Engine V1.1</title>
<style>
:root{--bg:#0b0d10;--panel:#151922;--muted:#8f99a8;--line:#2a3140;--text:#f5f7fb;--accent:#7c5cff;--good:#166534;--warn:#92400e;--danger:#991b1b}
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,Arial,sans-serif;background:var(--bg);color:var(--text)}
header{padding:16px 18px;border-bottom:1px solid var(--line);position:sticky;top:0;background:#0b0d10ee;backdrop-filter:blur(10px);z-index:5}
h1{font-size:18px;margin:0}.sub{color:var(--muted);font-size:12px;margin-top:4px}
main{display:grid;grid-template-columns:380px 1fr;gap:18px;padding:18px;max-width:1280px;margin:auto}.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px}
label{display:block;font-size:12px;color:var(--muted);margin:10px 0 6px}input,select,textarea,button{width:100%;border-radius:10px;border:1px solid var(--line);background:#0f131a;color:var(--text);padding:10px}
button{cursor:pointer;background:var(--accent);border:none;font-weight:700}button.secondary{background:#202635}button.good{background:var(--good)}button.warn{background:var(--warn)}button.danger{background:var(--danger)}button:disabled{opacity:.55;cursor:not-allowed}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}.stage-wrap{display:flex;justify-content:center;align-items:flex-start;min-height:70vh;padding-top:8px}
.stage{position:relative;width:min(42vw,420px);aspect-ratio:9/16;background:#000;border-radius:18px;overflow:hidden;border:1px solid var(--line);box-shadow:0 12px 50px #0008}video{width:100%;height:100%;object-fit:contain;background:#000}
.overlay{position:absolute;left:7%;right:7%;top:70%;transform:translateY(-50%);text-align:center;font-weight:900;font-size:clamp(22px,3vw,42px);line-height:1.05;text-shadow:0 3px 16px #000,0 2px 3px #000;pointer-events:none}.overlay.top{top:16%}.overlay.center{top:50%}.overlay.bottom{top:78%}.overlay.pop{animation:pop .18s ease-out}@keyframes pop{from{transform:translateY(-50%) scale(.72);opacity:0}to{transform:translateY(-50%) scale(1);opacity:1}}
.status{font-size:12px;color:var(--muted);margin-top:8px;white-space:pre-wrap}.status.ok{color:#86efac}.status.err{color:#fca5a5}.status.warn{color:#fcd34d}.items{display:flex;flex-direction:column;gap:8px;margin-top:10px;max-height:280px;overflow:auto}.item{padding:9px;border:1px solid var(--line);border-radius:10px;background:#10151d;font-size:12px}.item b{display:block;margin-bottom:4px}.tiny{font-size:11px;color:var(--muted)}.badge{display:inline-block;padding:4px 8px;border-radius:999px;background:#202635;font-size:11px;color:#cbd5e1;margin-top:6px}hr{border:none;border-top:1px solid var(--line);margin:16px 0}
@media(max-width:800px){main{grid-template-columns:1fr;padding:12px}.stage{width:min(92vw,420px)}.stage-wrap{min-height:auto}}
</style>
</head>
<body>
<header><h1>CLIPPER AI STUDIO — Overlay Engine V1.1</h1><div class="sub">Upload video → Auto Transcribe → Auto Caption → Preview → Export JSON</div></header>
<main>
<section class="panel">
<label>1. Upload video/audio</label><input id="file" type="file" accept="video/*,audio/*" /><div id="fileInfo" class="status">Belum ada file.</div>
<hr>
<label>2. AI Transcription — Cloudflare Workers AI</label><button id="transcribe" class="good">✨ Auto Transcribe</button><div id="aiStatus" class="status">Backend: Cloudflare Whisper Free</div>
<label>Hasil transkrip</label><textarea id="transcript" rows="6" placeholder="Hasil transkrip akan muncul di sini..."></textarea>
<div class="row"><div><label>Kata per caption</label><select id="wordsPerCaption"><option value="3">3 kata</option><option value="4" selected>4 kata</option><option value="5">5 kata</option><option value="6">6 kata</option></select></div><div><label>Posisi caption</label><select id="autoPosition"><option value="center">Tengah</option><option value="bottom" selected>Bawah</option><option value="top">Atas</option></select></div></div>
<button id="autoCaption" class="warn">⚡ Buat Caption Otomatis</button><div class="badge">V1.1: timing caption masih estimasi berdasarkan durasi file</div>
<hr>
<label>3. Tambah overlay manual</label><textarea id="text" rows="2" placeholder="Contoh: EDIT BAGUS AJA BELUM CUKUP!"></textarea>
<div class="row"><div><label>Mulai (detik)</label><input id="start" type="number" step="0.1" value="0" /></div><div><label>Selesai (detik)</label><input id="end" type="number" step="0.1" value="2.5" /></div></div>
<div class="row"><div><label>Posisi</label><select id="position"><option value="top">Atas</option><option value="center">Tengah</option><option value="bottom" selected>Bawah</option></select></div><div><label>Animasi</label><select id="animation"><option value="pop" selected>Pop</option><option value="">None</option></select></div></div>
<label>Warna teks</label><input id="color" type="color" value="#ffffff" />
<div style="height:10px"></div><button id="add">+ Tambah Overlay</button><div style="height:8px"></div><button class="secondary" id="useCurrent">Gunakan waktu video saat ini</button>
<label>Overlay Plan</label><div id="items" class="items"></div><div style="height:10px"></div><button class="secondary" id="export">Export overlay_plan.json</button><div style="height:8px"></div><button class="danger" id="clear">Hapus Semua Overlay</button><div id="status" class="status">0 overlay.</div>
</section>
<section class="panel stage-wrap"><div class="stage"><video id="video" controls playsinline></video><div id="overlay" class="overlay bottom" style="display:none"></div></div></section>
</main>
<script>
const ENDPOINT='https://clipper-overlay-api.disambikaro.workers.dev/transcribe';
const $=id=>document.getElementById(id);const video=$('video'),overlay=$('overlay'),items=$('items');let overlays=[],selectedFile=null;
$('file').addEventListener('change',e=>{const f=e.target.files?.[0];if(!f)return;selectedFile=f;video.src=URL.createObjectURL(f);const mb=(f.size/1024/1024).toFixed(2);$('fileInfo').textContent=`${f.name} · ${mb} MB`;$('fileInfo').className=f.size>10*1024*1024?'status warn':'status ok';if(f.size>10*1024*1024)$('fileInfo').textContent+='\n⚠️ Untuk endpoint V1.1 gunakan file < 10 MB dulu.';});
$('transcribe').addEventListener('click',async()=>{if(!selectedFile){alert('Pilih video/audio dulu.');return;}if(selectedFile.size>10*1024*1024){alert('File terlalu besar untuk V1.1. Gunakan file di bawah 10 MB dulu.');return;}const btn=$('transcribe');btn.disabled=true;$('aiStatus').textContent='Mengirim ke Cloudflare Whisper...';$('aiStatus').className='status warn';try{const form=new FormData();form.append('file',selectedFile,selectedFile.name);const res=await fetch(ENDPOINT,{method:'POST',body:form});const data=await res.json();if(!res.ok||!data.ok)throw new Error(data?.error||JSON.stringify(data));$('transcript').value=data.text||'';$('aiStatus').textContent=`Berhasil · ${data.model||'Whisper'} · ${data.provider||'Cloudflare Workers AI'}`;$('aiStatus').className='status ok';}catch(err){$('aiStatus').textContent='Gagal: '+err.message;$('aiStatus').className='status err';}finally{btn.disabled=false;}});
$('autoCaption').addEventListener('click',()=>{const text=$('transcript').value.trim();if(!text){alert('Transkrip masih kosong.');return;}if(!video.duration||!isFinite(video.duration)){alert('Tunggu metadata/durasi file terbaca dulu.');return;}const n=parseInt($('wordsPerCaption').value,10),words=text.split(/\s+/).filter(Boolean),chunks=[];for(let i=0;i<words.length;i+=n)chunks.push(words.slice(i,i+n).join(' '));const total=video.duration,segment=total/chunks.length,pos=$('autoPosition').value;overlays=overlays.filter(o=>o.source!=='auto-caption');chunks.forEach((chunk,i)=>{const start=i*segment,end=Math.min(total,(i+1)*segment);overlays.push({id:crypto.randomUUID?crypto.randomUUID():String(Date.now()+i),source:'auto-caption',type:'caption',text:chunk,start:+start.toFixed(2),end:+end.toFixed(2),position:pos,animation:'pop',color:'#ffffff'});});renderList();$('status').textContent=`${chunks.length} caption otomatis dibuat.`;$('status').className='status ok';});
$('useCurrent').onclick=()=>{$('start').value=(video.currentTime||0).toFixed(1);$('end').value=((video.currentTime||0)+2.5).toFixed(1);};
$('add').onclick=()=>{const text=$('text').value.trim(),start=parseFloat($('start').value||0),end=parseFloat($('end').value||0);if(!text)return alert('Isi teks overlay dulu.');if(end<=start)return alert('Waktu selesai harus lebih besar dari waktu mulai.');overlays.push({id:crypto.randomUUID?crypto.randomUUID():String(Date.now()),source:'manual',type:'text',text,start,end,position:$('position').value,animation:$('animation').value,color:$('color').value});renderList();};
$('clear').onclick=()=>{overlays=[];renderList();};
function esc(s){return s.replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function renderList(){items.innerHTML='';overlays.sort((a,b)=>a.start-b.start).forEach((o,idx)=>{const div=document.createElement('div');div.className='item';div.innerHTML=`<b>${idx+1}. ${esc(o.text)}</b><div class="tiny">${o.start}s → ${o.end}s · ${o.position} · ${o.animation||'none'} · ${o.source||'manual'}</div><button class="secondary" style="margin-top:7px;padding:6px" data-id="${o.id}">Hapus</button>`;items.appendChild(div);});items.querySelectorAll('button').forEach(btn=>{btn.onclick=()=>{overlays=overlays.filter(x=>x.id!==btn.dataset.id);renderList();};});$('status').textContent=`${overlays.length} overlay tersimpan.`;}
video.addEventListener('timeupdate',()=>{const t=video.currentTime,active=overlays.find(o=>t>=o.start&&t<=o.end);if(!active){overlay.style.display='none';return;}overlay.textContent=active.text;overlay.style.color=active.color||'#fff';overlay.className=`overlay ${active.position||'bottom'} ${active.animation||''}`;overlay.style.display='block';});
$('export').onclick=()=>{const payload={version:'1.1',engine:'Clipper AI Studio',transcriptionProvider:'Cloudflare Workers AI',aspectRatio:'9:16',createdAt:new Date().toISOString(),transcript:$('transcript').value.trim(),overlays};const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='overlay_plan_v1_1.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500);};renderList();
</script>
</body>
</html>
