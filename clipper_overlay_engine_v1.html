<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Clipper Overlay Engine V1</title>
<style>
  :root{
    --bg:#0b0d10;--panel:#151922;--muted:#8f99a8;--line:#2a3140;--text:#f5f7fb;
    --accent:#7c5cff;--good:#22c55e;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:Inter,system-ui,Arial,sans-serif;background:var(--bg);color:var(--text)}
  header{padding:16px 18px;border-bottom:1px solid var(--line);position:sticky;top:0;background:#0b0d10ee;backdrop-filter:blur(10px);z-index:5}
  h1{font-size:18px;margin:0}
  .sub{color:var(--muted);font-size:12px;margin-top:4px}
  main{display:grid;grid-template-columns:360px 1fr;gap:18px;padding:18px;max-width:1280px;margin:auto}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px}
  label{display:block;font-size:12px;color:var(--muted);margin:10px 0 6px}
  input,select,textarea,button{width:100%;border-radius:10px;border:1px solid var(--line);background:#0f131a;color:var(--text);padding:10px}
  button{cursor:pointer;background:var(--accent);border:none;font-weight:700}
  button.secondary{background:#202635}
  button.danger{background:#7f1d1d}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .stage-wrap{display:flex;justify-content:center;align-items:center;min-height:70vh}
  .stage{position:relative;width:min(42vw,420px);aspect-ratio:9/16;background:#000;border-radius:18px;overflow:hidden;border:1px solid var(--line);box-shadow:0 12px 50px #0008}
  video{width:100%;height:100%;object-fit:cover}
  .overlay{position:absolute;left:7%;right:7%;top:70%;transform:translateY(-50%);text-align:center;font-weight:900;font-size:clamp(22px,3vw,42px);line-height:1.05;text-shadow:0 3px 16px #000,0 2px 3px #000;pointer-events:none}
  .overlay.top{top:16%}.overlay.center{top:50%}.overlay.bottom{top:78%}
  .overlay.pop{animation:pop .18s ease-out}
  @keyframes pop{from{transform:translateY(-50%) scale(.7);opacity:0}to{transform:translateY(-50%) scale(1);opacity:1}}
  .status{font-size:12px;color:var(--muted);margin-top:8px}
  .items{display:flex;flex-direction:column;gap:8px;margin-top:10px;max-height:280px;overflow:auto}
  .item{padding:9px;border:1px solid var(--line);border-radius:10px;background:#10151d;font-size:12px}
  .item b{display:block;margin-bottom:4px}
  .tiny{font-size:11px;color:var(--muted)}
  @media(max-width:800px){
    main{grid-template-columns:1fr;padding:12px}
    .stage{width:min(92vw,420px)}
    .stage-wrap{min-height:auto}
  }
</style>
</head>
<body>
<header>
  <h1>CLIPPER AI STUDIO — Overlay Engine V1</h1>
  <div class="sub">Upload video → buat overlay → preview realtime → export JSON</div>
</header>

<main>
  <section class="panel">
    <label>1. Upload video</label>
    <input id="file" type="file" accept="video/*" />

    <label>2. Teks overlay</label>
    <textarea id="text" rows="2" placeholder="Contoh: EDIT BAGUS AJA BELUM CUKUP!"></textarea>

    <div class="row">
      <div>
        <label>Mulai (detik)</label>
        <input id="start" type="number" step="0.1" value="0" />
      </div>
      <div>
        <label>Selesai (detik)</label>
        <input id="end" type="number" step="0.1" value="2.5" />
      </div>
    </div>

    <div class="row">
      <div>
        <label>Posisi</label>
        <select id="position">
          <option value="top">Atas</option>
          <option value="center">Tengah</option>
          <option value="bottom" selected>Bawah</option>
        </select>
      </div>
      <div>
        <label>Animasi</label>
        <select id="animation">
          <option value="pop" selected>Pop</option>
          <option value="">None</option>
        </select>
      </div>
    </div>

    <label>Warna teks</label>
    <input id="color" type="color" value="#ffffff" />

    <div style="height:10px"></div>
    <button id="add">+ Tambah Overlay</button>
    <div style="height:8px"></div>
    <button class="secondary" id="useCurrent">Gunakan waktu video saat ini</button>

    <label>Overlay Plan</label>
    <div id="items" class="items"></div>

    <div style="height:10px"></div>
    <button class="secondary" id="export">Export overlay_plan.json</button>
    <div style="height:8px"></div>
    <button class="danger" id="clear">Hapus Semua Overlay</button>
    <div id="status" class="status">Belum ada video.</div>
  </section>

  <section class="panel stage-wrap">
    <div class="stage">
      <video id="video" controls playsinline></video>
      <div id="overlay" class="overlay bottom" style="display:none"></div>
    </div>
  </section>
</main>

<script>
const $ = (id)=>document.getElementById(id);
const video=$('video'), overlay=$('overlay'), items=$('items'), status=$('status');
let overlays=[];

$('file').addEventListener('change', e=>{
  const f=e.target.files?.[0];
  if(!f) return;
  video.src=URL.createObjectURL(f);
  status.textContent=`Video: ${f.name}`;
});

$('useCurrent').addEventListener('click', ()=>{
  $('start').value=(video.currentTime||0).toFixed(1);
  $('end').value=((video.currentTime||0)+2.5).toFixed(1);
});

$('add').addEventListener('click', ()=>{
  const text=$('text').value.trim();
  const start=parseFloat($('start').value||0);
  const end=parseFloat($('end').value||0);
  if(!text) return alert('Isi teks overlay dulu.');
  if(end<=start) return alert('Waktu selesai harus lebih besar dari waktu mulai.');
  overlays.push({
    id: crypto.randomUUID ? crypto.randomUUID() : String(Date.now()),
    type:'text',
    text,start,end,
    position:$('position').value,
    animation:$('animation').value,
    color:$('color').value
  });
  renderList();
});

$('clear').addEventListener('click', ()=>{
  overlays=[];
  renderList();
});

function renderList(){
  items.innerHTML='';
  overlays.sort((a,b)=>a.start-b.start).forEach((o,idx)=>{
    const div=document.createElement('div');
    div.className='item';
    div.innerHTML=`<b>${idx+1}. ${escapeHtml(o.text)}</b>
      <div class="tiny">${o.start}s → ${o.end}s · ${o.position} · ${o.animation||'none'}</div>
      <button class="secondary" style="margin-top:7px;padding:6px" data-id="${o.id}">Hapus</button>`;
    items.appendChild(div);
  });
  items.querySelectorAll('button').forEach(btn=>{
    btn.onclick=()=>{
      overlays=overlays.filter(x=>x.id!==btn.dataset.id);
      renderList();
    };
  });
  status.textContent=`${overlays.length} overlay tersimpan.`;
}

function escapeHtml(s){
  return s.replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
}

video.addEventListener('timeupdate', ()=>{
  const t=video.currentTime;
  const active=overlays.find(o=>t>=o.start && t<=o.end);
  if(!active){
    overlay.style.display='none';
    return;
  }
  overlay.textContent=active.text;
  overlay.style.color=active.color||'#fff';
  overlay.className=`overlay ${active.position||'bottom'} ${active.animation||''}`;
  overlay.style.display='block';
});

$('export').addEventListener('click', ()=>{
  const payload={
    version:'1.0',
    aspectRatio:'9:16',
    createdAt:new Date().toISOString(),
    overlays
  };
  const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='overlay_plan.json';
  a.click();
  URL.revokeObjectURL(a.href);
});
</script>
</body>
</html>
